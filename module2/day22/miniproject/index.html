<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETB Currency Converter</title>
</head>
<body>

    <h1>ETB Currency Converter</h1>

    <p id="status"></p>

    <form id="convert-form">
        <label for="amount">Amount in ETB:</label>
        <input id="amount" type="number" placeholder="Enter amount">

        <label for="currency">Currency:</label>
        <select id="currency"></select>

        <button type="submit">Convert</button>
    </form>

    <p id="result"></p>

    <button id="add-watch" type="button">
        Add to Watchlist
    </button>

    <h2>Watchlist</h2>

    <ul id="watchlist"></ul>

    <script src="app.js"></script>
</body>
</html>
