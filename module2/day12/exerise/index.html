<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ethiotel</title>
</head>
<body>
    <header>
        <h1>ethiotel</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" pattern="\+251[0-9]{9}" required>
            <label for="location-type">Room Type:</label>
            <select id="location-type" name="room-type" required>
                <option value="">Select branch</option>
                <option value="single">Bole</option>
                <option value="double">Kazanchis</option>
                <option value="suite">Piassa</option>
            </select>
            <input type="submit" value="Submit">

        </form>
        <table>
            <thead>
                <tr>
                    <th>Flight</th>
                    <th>From</th>
                    <th>Departure</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>101</td>
                    <td>Addis Ababa</td>
                    <td>08:00 AM</td>
                    <td>100ETB</td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Adama</td>
                    <td>09:00 AM</td>
                    <td>120ETB</td>
                </tr>
                <tr>
                    <td>103</td>
                    <td>Jimma</td>
                    <td>10:00 AM</td>
                    <td>140ETB</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
