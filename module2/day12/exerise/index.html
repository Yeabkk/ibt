<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ethiotel</title>
</head>
<body>
    <header>
        <h1>ethiotel</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <form action="" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" pattern="\+251[0-9]{9}" required>
            <label for="location-type">Room Type:</label>
            <select id="location-type" name="room-type" required>
                <option value="">Select branch</option>
                <option value="kazanchis">Kazanchis</option>
                <option value="piassa">Piassa</option>
                <option value="bole">Bole</option>
            </select>
            <input type="submit" value="Submit">

        </form>
        <table>
            <thead>
                <caption>Flight Schedule</caption>
                <tr>
                    <th>Flight</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Departure</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>101</td>
                    <td>Addis Ababa</td>
                    <td>Dire Dawa</td>
                    <td>08:00 AM</td>
                    <td>100ETB</td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Adama</td>
                    <td>Hawassa</td>
                    <td>09:00 AM</td>
                    <td>120ETB</td>
                </tr>
                <tr>
                    <td>103</td>
                    <td>Jimma</td>
                    <td>Gondar</td>
                    <td>10:00 AM</td>       
                    <td>140ETB</td>
                </tr>
            </tbody>
        </table>

        <section>
            <h2>Explore Addis Ababa</h2>
            <figure>
                <img src="../etImage.jpg" alt="Amesument park" width="600" height="400">
                <figcaption>Amesument park.</figcaption>
            </figure>
            <iframe
                src="https://www.openstreetmap.org/export/embed.html?bbox=38.7250%2C9.0000%2C38.7900%2C9.0600&amp;layer=mapnik&amp;marker=9.0320%2C38.7469"
                title="Map of Addis Ababa, Ethiopia"
                width="600" height="450" loading="lazy">
            </iframe>
        </section>
        
    </main>
</body>
</html>
