<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha Eatery.Bole</title>
    <meta name="description" content="Habesha Eatery is a restaurant located in Bole, Addis Ababa, offering a variety of Ethiopian dishes.">
</head>
<body>
    <header>
        <h1>Habesha Eatery</h1>
    </header>
     <nav><a href="index.html">Reservations</a> · <a href="contact.html">Contact</a></nav>
    <main>
        <form action="" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
            <input type="submit" value="Submit">
        </form>
        <table>
            <caption>Menu table</caption>
            <thead>
                <tr>
                    <th>Dish</th>
                    <th>Price (ETB)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Injera</td>
                    <td>150</td>
                </tr>
                <tr>
                    <td>Wot</td>
                    <td>200</td>
                </tr>
                <tr>
                    <td>Kitfo</td>
                    <td>300</td>
                </tr>
            </tbody>
        </table>
        <figure>
            <img src="images/restaurant.jpg" alt="Habesha Eatery Restaurant">
            <figcaption>Habesha Eatery Restaurant</figcaption>
        </figure>
        <figure>
            <video controls>
                <source src="videos/restaurant-tour.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <figcaption>Restaurant Tour</figcaption>
        </figure>
    </main>
    <footer>
        <address>Bole,Addis Ababa</address>
        <a href="contact.html">contact</a>
    </footer>
</body>
</html>
